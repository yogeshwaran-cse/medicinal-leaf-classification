[project]
name = "medicinal-leaf-backend"
version = "0.1.0"
description = "FastAPI backend for Indian Medicinal Leaf Classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16.0",
    "tf-keras>=2.16.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
